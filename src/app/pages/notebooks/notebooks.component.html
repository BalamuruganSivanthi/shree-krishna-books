<div class="notebooks-page">
    <div class="header-spacer"></div>
    <div class="page-header">
        <h1>Our Notebooks</h1>
        <p>Discover the perfect canvas for your thoughts.</p>
    </div>

    <div class="products-grid">
        <div class="product-card" *ngFor="let product of products" [routerLink]="['/order', product.id]">
            <div class="product-image">
                <img [src]="product.images[0]" [alt]="product.name">
            </div>
            <div class="product-info">
                <h3>{{ product.name }}</h3>
                <div class="product-specs">
                    <p><strong>Sizes:</strong> {{ product.sizes.join(', ') }}</p>
                    <p><strong>Paper:</strong> {{ product.paperTypes.join(', ') }}</p>
                    <p><strong>Cover:</strong> {{ product.coverTypes.join(', ') }}</p>
                </div>
                <p class="price" *ngIf="product.price > 0">₹{{ product.price | number }}</p>
                <p class="price contact-pricing" *ngIf="product.price === 0">Contact Us for Pricing</p>
                <button class="add-btn">View Details</button>
            </div>
        </div>
    </div>
</div>
