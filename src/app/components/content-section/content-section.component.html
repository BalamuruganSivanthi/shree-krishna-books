<section [id]="id" class="content-section" [ngClass]="{'full-width': isFullWidth, 'about-section': isAboutSection}">
    <div class="section-container">

        <div *ngIf="image && imagePosition === 'left'" class="section-image">
            <img [src]="image" [alt]="imageAlt" />
        </div>

        <div class="section-text">
            <h2 class="section-title">{{title}}</h2>
            <div class="section-description">
                <ng-content></ng-content>
                <p *ngIf="description">{{description}}</p>
            </div>
        </div>

        <div *ngIf="image && imagePosition === 'right'" class="section-image">
            <img [src]="image" [alt]="imageAlt" />
        </div>

    </div>
</section>
